[project]
name = "enterprise-agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "contextvars>=2.4",
    "google-search-results>=2.4.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tavily>=1.1.0",
    "typing-extensions>=4.16.0",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0"
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring real external services",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]
